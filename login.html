<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | User Management</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1 class="page-title">Login | User Management</h1>
    <div class="form-box">
        <h2 class="form-title">Sign In</h2>
        <form action="#" method="GET" name="user_form">
            <div class="field-group">
                <label for="username">Username / E-mail</label>
                <input type="text" id="username" name="username" value=""><span> </span>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="">
            </div>
            <div class="field-group">
                <input type="checkbox" id="remember" name="remember" value="1">
                <label for="remember">Remember login credentials.</label>
            </div>
            <button type="submit" name="submit">Login</button>
        </form>
        <hr>
        <div class="note">
            Don't you have an account? <a href="./register.html" class="text-link" title="">Register Now</a>
        </div>
        <hr>
        <a href="./forgot-password.html" class="text-link" title="">Forgot Password?</a>
        <hr>
        <a href="./index.html" class="text-link" title="">Back to Home</a>
    </div>

    <!-- Scripts -->
    <script src="./script.js"></script>
</body>

</html>
