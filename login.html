<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Login</h1>
    <div class="hero-box">
        <h2 class="box-title">Login | User Management</h2>
        <div class="box-para">
            <p>Please enter your credentials to login.</p>
        </div>

        <form action="#" method="get">
            <div class="form-group">
                <label for="username">Username</label>
                <div></div>
                <input type="text" id="username" name="username" value="">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div></div>
                <input type="password" id="password" name="password" value="">
            </div>

            <div class="form-group">
                <div></div>
                <input type="checkbox" id="remember" name="remember" value="1">
                <label for="remember">Remember login credentials.</label>


                <div class="btn-group">
                    <a href="#" title="Login" class="btn">Login</a>
                    <a href="forgot-password.html" title="forgot-password" class="btn btn-secondary">Forget Password</a>
                </div>
                <hr>
                <!-- Don't you have registeran account? Register Now -->
                <P>Don't you have a registered account? <a href="register.html" title="Register">Register Now</a></P>


                <hr>
                <!-- Back to home -->
                <a href="index.html" title="Home">Back to home</a>
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
