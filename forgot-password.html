<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | User Management</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1 class="page-title">Forgot Password | User Management</h1>
    <div class="form-box">
        <h2 class="form-title">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="#d9a94e" stroke-width="1.4"/>
                <path d="M9 12L11 14L15.5 9.5" stroke="#d9a94e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Reset Password</span>
        </h2>
        <p class="note">Enter the email on your account and we'll cut you a new key.</p>
        <form action="#" method="GET">
            <div class="field-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" value="">
            </div>
            <button type="submit" name="submit">
                <span>Send reset link</span>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" id="submit-spinner" style="display:none;">
                    <circle cx="12" cy="12" r="9" stroke="#1a1408" stroke-width="2" stroke-dasharray="42" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.7s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </button>
        </form>
        <hr>
        <div class="note">
            Don't you want to reset password? <a href="./login.html" class="text-link" title="">Back to Login</a>
        </div>
        <hr>
        <a href="./index.html" class="text-link" title="">Back to Home</a>
    </div>

    <!-- Scripts -->
    <script src="./script.js"></script>
</body>
</html>
